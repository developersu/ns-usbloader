steps:
  - name: build-standard-jar
    when:
      event: [tag, push, manual]
    image: maven:3-amazoncorretto-25-debian
    commands:
      - mvn -B -DskipTests clean package
      - mvn test -B
      - echo target/ns-usbloader-*jar
      - mkdir artifacts
      - cp target/ns-usbloader-*jar artifacts
      - cp target/NS-USBloader.exe artifacts
    volumes:
      - /home/docker/woodpecker/files/m2:/root/.m2

  - name: build-windows-installer
    when:
      event: [tag, push, manual]
    image: wheatstalk/makensis:3
    commands:
      - cp "$CI_WORKSPACE/artifacts/NS-USBloader.exe" "$CI_WORKSPACE/misc/windows/NSIS/"
      - $CI_WORKSPACE/misc/windows/create_nsis.sh
      - cd "$CI_WORKSPACE/misc/windows/NSIS"
      - echo Installer-*.exe
      - cp Installer-*.exe "$CI_WORKSPACE/artifacts"
      - rm ./NS-USBloader.exe ./Installer-*.exe
    volumes:
      - /home/docker/woodpecker/files/assembly/openjdk-25.0.1:/assembly/jdk
      - /home/docker/woodpecker/files/assembly/Drivers_set.exe:/assembly/Drivers_set.exe

  - name: build-legacy-jar
    when:
      event: [tag, push, manual]
    image: maven:3-amazoncorretto-25-debian
    commands:
      - mvn -B -DskipTests clean package -Plegacy
      - echo target/ns-usbloader-*jar
      - mkdir artifacts
      - cp target/ns-usbloader-*jar artifacts
      - cp target/NS-USBloader.exe artifacts
    volumes:
      - /home/docker/woodpecker/files/m2:/root/.m2

  - name: build-legacy-windows-installer
    when:
      event: [tag, push, manual]
    image: wheatstalk/makensis:3
    commands:
      - cp "$CI_WORKSPACE/artifacts/NS-USBloader.exe" "$CI_WORKSPACE/misc/windows/NSIS/"
      - $CI_WORKSPACE/misc/windows/create_nsis.sh legacy
      - cd "$CI_WORKSPACE/misc/windows/NSIS"
      - echo Installer-*.exe
      - cp Installer-*.exe "$CI_WORKSPACE/artifacts"
      - rm ./NS-USBloader.exe ./Installer-*.exe
    volumes:
      - /home/docker/woodpecker/files/assembly/openjdk-25.0.1:/assembly/jdk
      - /home/docker/woodpecker/files/assembly/Drivers_set.exe:/assembly/Drivers_set.exe

  - name: build-mac+linux-aarch64-jar
    when:
      event: [tag, push, manual]
    image: maven:3-amazoncorretto-25-debian
    commands:
      - mvn -B -DskipTests clean package -Paarch64
      - echo target/ns-usbloader-*jar
      - mkdir artifacts
      - cp target/ns-usbloader-*jar artifacts
    volumes:
      - /home/docker/woodpecker/files/m2:/root/.m2

  - name: save-artifacts
    when:
      event: [tag, push]
    image: alpine:latest
    commands:
      - cd artifacts/
      - rm NS-USBloader.exe
      - sha512sum ./* > ./sha512.txt
      - cd ..
      - export ARTIFACTS_DIR="$(date -d @$CI_PIPELINE_CREATED +'%Y-%m-%d %H:%M %Z')"
      - mkdir -p /builds/$CI_REPO_NAME
      - mv -v artifacts "/builds/$CI_REPO_NAME/$ARTIFACTS_DIR"
    volumes:
      - /home/www/builds:/builds
